<!DOCTYPE html>
<html>

<body>

    <h2>What Can JavaScript Do?</h2>

    <p id="demo">JavaScript can change HTML content.</p>

    <button type="button" onclick='document.getElementById("demo").innerHTML = "Hello JavaScript!"'>Click Me!</button>

    <hr>

    <p>Would you try the bug zapper?</p>

    <button onclick="document.getElementById('image').src = 'images/bugZapperOn.jpg'">Zap the Bug!</button>

    <img id="image" src="images/bugZapperOff.jpg" width="450" height="450">

    <button onclick="document.getElementById('image').src = 'images/bugZapperOff.jpg'">Turn Off</button>

</body>

</html>
